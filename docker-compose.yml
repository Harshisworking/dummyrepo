services:
  db:
    image: postgres:alpine
    container_name: ${PROJECT_NAME}-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-example_password}
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_DB: ${DB_NAME:-mydatabase}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      internal-bridge:
        aliases:
          - db # This makes the hostname 'db' work perfectly
    restart: always

  api-server:
    build: ./backend
    container_name: ${PROJECT_NAME}-api-server
    networks:
      - internal-bridge
      - web-gateway
    depends_on:
      - db
    restart: on-failure # Important: If it fails to connect to DB, Docker will restart it

  frontend:
    build:
      context: ./frontend
    container_name: ${PROJECT_NAME}-frontend
    stdin_open: true
    tty: true
    networks:
      - internal-bridge
      - web-gateway
    depends_on:
      - api-server

networks:
  internal-bridge:
    driver: bridge
  web-gateway:
    external: true

volumes:
  db_data:
